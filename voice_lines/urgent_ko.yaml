# 긴급 콜 사전 생성 변형 풀 (한국어) — 이벤트 타입 × 톤 태그 구조.
#
# 구조: <풀 이름>: { casual: [...], urgent: [...] }
#   - casual: 평상시 톤. urgent: 배틀 중(±2초 경쟁)/나란히 상황의 긴박 톤.
#   - 톤이 하나뿐인 풀은 그 톤이 폴백으로 쓰인다.
# 재생 시 랜덤 선택 + 최근 사용 이력 제외로 반복감을 줄인다.
# scripts/generate_variants.py로 LLM 일괄 재생성 가능, tools/pregen_audio.py로
# 전체 오디오 사전 캐시 → 지연 0.
#
# 슬롯은 이산값만: {cls}=클래스명(하이퍼카/엘엠피 투/GT3/상위 클래스),
# {gap}=초(정수 1~6), {fuel_laps}=랩(정수 1~4). 연속값 금지(캐시 불가).

traffic_approach:            # 접근 예고 (도달 3~10초 전)
  casual:
    - "{cls} 뒤로 {gap}초."
    - "{cls} 접근 중, {gap}초 뒤에 온다."
    - "뒤에 {cls}, {gap}초. 라인 유지해."
    - "{cls}가 {gap}초 뒤야. 미리 준비해."
    - "{gap}초 뒤 {cls}. 니 레이스에 집중해."
    - "{cls} 오고 있어, {gap}초. 예측 가능하게 가자."
    - "뒤쪽 {cls}, {gap}초 안에 붙는다."
    - "{gap}초 후 {cls} 지나간다. 라인 그대로."
    - "체크. {cls}가 {gap}초 뒤에 있다."
    - "{cls} 트래픽 {gap}초. 코너에서 양보하지 말고 직선에서 보내."
    - "뒤에서 {cls} 온다. {gap}초."
    - "{cls}야, {gap}초 뒤. 흐름 깨지 말자."
    - "{gap}초 뒤에 {cls} 도착. 침착하게."
    - "곧 {cls} 온다. {gap}초 남았어."
    - "{cls}한테 {gap}초. 니 페이스 유지해."
  urgent:
    - "트래픽! {cls} {gap}초 뒤."
    - "{cls} 클로징, {gap}초. 당황하지 마."
    - "{cls} 어프로치, {gap}초. 미러 봐."
    - "블루 상황이야. {cls} {gap}초 뒤."
    - "{cls} {gap}초. 놀라지 말고 하던 대로."
    - "{cls} 빠르게 온다, {gap}초!"
    - "미러 체크, {cls} {gap}초."
    - "{gap}초 뒤 {cls}, 배틀 중이니까 더 조심."

alongside:                   # 나란히 (좌우 불명)
  urgent:
    - "옆이야!"
    - "옆에 붙었어!"
    - "나란히 간다, 공간 줘."
    - "옆에 차 있어, 라인 지켜."
    - "사이드 바이 사이드!"
    - "옆이야, 접촉 조심!"
    - "지금 옆에 있어, 조이지 마."
    - "나란히야. 코너 같이 들어간다."
    - "옆 차 있다, 한 대 폭 남겨."
    - "붙었어 옆에. 침착하게."

alongside_left:              # 왼쪽에 나란히
  urgent:
    - "왼쪽!"
    - "왼쪽에 있어!"
    - "왼쪽 나란히!"
    - "카 레프트, 조심!"
    - "왼쪽에 붙었어, 라인 지켜."
    - "왼쪽이야, 조이지 마!"
    - "왼쪽 옆이야. 공간 남겨."
    - "레프트 사이드! 접촉 조심."

alongside_right:             # 오른쪽에 나란히
  urgent:
    - "오른쪽!"
    - "오른쪽에 있어!"
    - "오른쪽 나란히!"
    - "카 라이트, 조심!"
    - "오른쪽에 붙었어, 라인 지켜."
    - "오른쪽이야, 조이지 마!"
    - "오른쪽 옆이야. 공간 남겨."
    - "라이트 사이드! 접촉 조심."

nearby_behind:               # 뒤 50m 이내 진입
  casual:
    - "뒤 붙었어."
    - "뒤에 하나 붙었다. 침착하게."
    - "뒤차 근접. 라인 유지해."
    - "뒤에 있어. 예측 가능하게 움직여."
    - "뒤차 붙었다. 하던 대로 해."
    - "{cls} 뒤에 붙었어."
    - "뒤에 차 있다. 이상한 움직임만 하지 마."
    - "뒤차 근접 중. 브레이킹 포인트 일정하게."
  urgent:
    - "뒤 붙었어!"
    - "뒤차 코앞이야. 방어는 한 번만."
    - "뒤에 붙었다, 실수 유도하려는 거야. 말리지 마."
    - "뒤차 바로 뒤! 니 라인 지켜."
    - "붙었어 뒤에. 깔끔하게 가자."
    - "{cls} 바로 뒤야!"
    - "뒤차 근접, 트랙 포지션 우선."

pass_complete:               # 추월당함 완료 → 서사 마무리
  casual:
    - "지나갔어, 라인 복귀해도 돼."
    - "클리어. 다시 니 라인으로."
    - "보냈어. 페이스 다시 올리자."
    - "지나갔다. 리듬 되찾아."
    - "클리어야, 정상 라인으로."
    - "갔어. 이제 니 레이스 하자."
    - "통과했어. 손해 최소화 잘했어."
    - "보냈고, 앞은 클리어."

dropped:                     # 배틀하던 차가 떨어짐
  casual:
    - "떨어졌어. 페이스 유지."
    - "갭 벌어졌다. 잘 버텼어."
    - "뒤차 떨어졌어. 이제 관리 모드."
    - "털어냈어. 좋았어."
    - "뒤 클리어. 니 페이스로 가자."
    - "포기했나 보다. 집중 유지해."

fuel_warning:                # 연료 경고 (HIGH)
  casual:
    - "연료 앞으로 {fuel_laps}랩 분량이야."
    - "연료 체크. {fuel_laps}랩 남았어."
    - "연료 {fuel_laps}랩. 피트 계획 잡자."
    - "탱크에 {fuel_laps}랩 남았다."
    - "연료 상황, {fuel_laps}랩 분량. 곧 불러줄게."
    - "퓨얼 {fuel_laps}랩. 윈도우 열렸어."
    - "연료로는 {fuel_laps}랩이야. 준비하고 있어."
    - "{fuel_laps}랩 치 연료 남았어. 세이브 모드 고려해."
    - "연료 잔량 {fuel_laps}랩. 리프트 앤 코스트 섞어줘."
    - "연료 보고. {fuel_laps}랩 커버 가능."
    - "{fuel_laps}랩 뒤엔 넣어야 해. 염두에 둬."
    - "연료는 {fuel_laps}랩이야. 타이어랑 같이 판단하자."
  urgent:
    - "연료 {fuel_laps}랩! 세이브 시작해."
    - "퓨얼 타이트해. {fuel_laps}랩."
    - "연료 {fuel_laps}랩 남았다, 배틀은 아껴서 해."

fuel_critical:               # 연료 긴급 (CRITICAL)
  urgent:
    - "연료 심각해. {fuel_laps}랩이면 바닥이야."
    - "퓨얼 크리티컬. {fuel_laps}랩 안에 들어와야 해."
    - "연료 {fuel_laps}랩. 지금부터 풀 세이브."
    - "탱크 거의 비었어. {fuel_laps}랩 리밋."
    - "연료 한계야. {fuel_laps}랩 안에 박스."
    - "크리티컬. 연료 {fuel_laps}랩 남았다."
    - "연료 바닥 보인다. {fuel_laps}랩이 마지노선."
    - "퓨얼 이머전시. {fuel_laps}랩, 그 이상은 없어."
    - "연료 {fuel_laps}랩. 세이브 안 하면 못 들어와."
    - "마지막 경고야. 연료 {fuel_laps}랩."
    - "{fuel_laps}랩 치밖에 없어. 박스 준비."

pit_call:                    # 박스 콜 (CRITICAL)
  casual:
    - "박스 박스, 박스 박스."
    - "박스 박스. 이번 랩에 들어와."
    - "박스 콜이야. 이번 랩 피트인."
    - "이번 랩 박스. 컨펌해줘."
    - "피트인, 이번 랩이야. 박스 박스."
    - "박스 박스. 크루 준비됐어."
    - "박스 콜. 진입 라인 조심하고."
    - "오케이, 박스 박스. 이번 랩."
  urgent:
    - "박스 박스! 이번 랩이야!"
    - "들어와, 박스 박스!"
    - "피트 윈도우 마감이야. 이번 랩 박스."
    - "박스 박스. 피트 리밋 잊지 마."

damage:                      # 데미지 체크 (CRITICAL)
  urgent:
    - "접촉 확인. 차 상태 어때?"
    - "임팩트 감지됐어. 핸들링 체크해봐."
    - "데미지 있을 수 있어. 데이터 보고 있다."
    - "방금 충격 컸어. 차 괜찮아?"
    - "접촉이야. 타이어 프레셔 확인 중."
    - "임팩트. 스티어링 센터 맞는지 봐줘."
    - "차에 충격 들어왔어. 이상하면 바로 말해."
    - "데미지 체크 중. 일단 페이스 유지해."
    - "접촉 감지. 에어로 손상 가능성 있어."
    - "충격 확인했어. 다음 스트레이트에서 감각 체크해봐."
    - "방금 그거 컸다. 차 반응 어때?"
    - "임팩트 로그 떴어. 문제 있으면 박스 검토하자."

penalty:                     # 페널티 (CRITICAL)
  casual:
    - "페널티 떴어. 확인해."
    - "페널티야. 처리 타이밍 잡아줄게."
    - "스튜어드 콜, 페널티 하나."
    - "페널티 부여됐어. 침착하게."
    - "페널티 떴다. 다음 피트 때 같이 처리하자."
    - "페널티 하나 쌓였어. 드라이브 스루 각오해."
    - "페널티 확인. 억울해도 지금은 페이스 유지."
    - "페널티야. 만회 가능한 수준이야."
    - "페널티 하나. 처리 전략 다시 계산 중."
    - "스튜어드가 봤나 봐. 페널티 하나 떴어."
