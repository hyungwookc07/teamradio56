# 긴급 콜 사전 생성 변형 풀 (한국어) — 이벤트 타입 × 톤 태그 구조.
#
# 구조: <풀 이름>: { casual: [...], urgent: [...] }
#   - casual: 평상시 톤. urgent: 배틀 중(±2초 경쟁)/나란히 상황의 긴박 톤.
#   - 톤이 하나뿐인 풀은 그 톤이 폴백으로 쓰인다.
# 재생 시 랜덤 선택 + 최근 사용 이력 제외로 반복감을 줄인다.
# scripts/generate_variants.py로 LLM 일괄 재생성 가능, tools/pregen_audio.py로
# 전체 오디오 사전 캐시 → 지연 0.
#
# 스타일: 실제 팀라디오처럼 단어 위주, 어미 최소, 짧게 끊는다.
# 슬롯은 이산값만: {cls}=클래스명(하이퍼카/엘엠피 투/GT3/상위 클래스),
# {gap}=초(정수 1~6), {fuel_laps}=랩(정수 1~4), {side}=왼쪽/오른쪽,
# {place}=순위(정수 1~8). 연속값 금지(캐시 불가).

traffic_approach:            # 접근 예고 (도달 3~10초 전)
  casual:
    - "{cls}, {gap}초 뒤."
    - "{cls} 접근, {gap}초."
    - "뒤에 {cls}, {gap}초. 라인 유지."
    - "{cls} {gap}초. 준비."
    - "{gap}초 뒤 {cls}. 페이스 유지."
    - "{cls} 트래픽 {gap}초. 직선에서 보내."
    - "뒤쪽 {cls}, {gap}초."
    - "{gap}초 후 {cls} 통과. 라인 그대로."
    - "체크. {cls} {gap}초 뒤."
    - "{cls} 하나, {gap}초 뒤."
    - "곧 {cls}. {gap}초."
  urgent:
    - "트래픽! {cls} {gap}초."
    - "{cls} 클로징, {gap}초."
    - "{cls} 접근, {gap}초. 미러."
    - "랩 트래픽, {cls} {gap}초."
    - "{cls} {gap}초. 하던 대로."
    - "{cls} 온다, {gap}초!"
    - "미러 체크. {cls} {gap}초."

alongside:                   # 나란히 (좌우 불명)
  urgent:
    - "옆이야!"
    - "옆에 붙었어!"
    - "나란히. 공간 줘."
    - "옆에 차. 라인 유지."
    - "사이드 바이 사이드!"
    - "옆이야, 접촉 조심!"
    - "옆에 있어, 조이지 마."
    - "옆 차. 한 대 폭."

alongside_left:              # 왼쪽에 나란히
  urgent:
    - "왼쪽!"
    - "왼쪽에 차!"
    - "왼쪽 나란히!"
    - "카 레프트!"
    - "왼쪽, 조심!"
    - "왼쪽이야, 조이지 마!"
    - "왼쪽. 공간."

alongside_right:             # 오른쪽에 나란히
  urgent:
    - "오른쪽!"
    - "오른쪽에 차!"
    - "오른쪽 나란히!"
    - "카 라이트!"
    - "오른쪽, 조심!"
    - "오른쪽이야, 조이지 마!"
    - "오른쪽. 공간."

alongside_both:              # 양쪽 동시 점유 (스타트 혼전 스포터)
  urgent:
    - "양쪽에 차!"
    - "양쪽이야!"
    - "쓰리 와이드, 가운데!"
    - "양옆 붙었다. 공간 없어!"

side_clear:                  # 좌/우 클리어 (스타트 혼전 스포터)
  casual:
    - "{side} 클리어."
    - "{side} 비었어."
    - "{side} 클리어, 써도 돼."

nearby_behind:               # 뒤 50m 이내 진입
  casual:
    - "뒤 붙었어."
    - "뒤에 하나. 침착하게."
    - "뒤차 근접. 라인 유지."
    - "뒤에 있어. 움직임 일정하게."
    - "{cls} 뒤에 붙었어."
    - "뒤에 차. 라인 그대로."
    - "뒤차 근접. 브레이킹 일정하게."
  urgent:
    - "뒤 붙었어!"
    - "뒤차 코앞. 방어는 한 번만."
    - "바로 뒤야! 라인 지켜."
    - "붙었어 뒤에. 깔끔하게."
    - "{cls} 바로 뒤!"
    - "뒤차 근접. 포지션 우선."

pass_complete:               # 추월당함 완료 → 서사 마무리
  casual:
    - "지나갔어. 라인 복귀."
    - "클리어. 니 라인으로."
    - "보냈어. 페이스 회복."
    - "지나갔다. 리듬 찾아."
    - "클리어. 정상 라인."
    - "갔어. 니 레이스."
    - "보냈고, 앞 클리어."

dropped:                     # 배틀하던 차가 떨어짐
  casual:
    - "떨어졌어. 페이스 유지."
    - "갭 벌어졌다. 잘 버텼어."
    - "뒤차 떨어짐. 관리 모드."
    - "털어냈어."
    - "뒤 클리어. 니 페이스로."

backmarker_ahead:            # 전방 백마커 (내가 랩 돌리는 트래픽)
  casual:
    - "앞에 백마커 {cls}. 침착하게."
    - "전방 백마커. 깔끔하게 처리."
    - "앞 {cls} 백마커. 블루 받는 중일 거야."
    - "백마커. 타이밍 봐서 한 번에."
    - "앞차 랩 다운. 배틀 아님."
    - "백마커 트래픽. 여유 두고."
  urgent:
    - "앞 백마커! 거리 두고."
    - "백마커 조심. 침착하게."
    - "전방 백마커. 한 번에 처리."

blue_flag:                   # 블루 플래그 (랩 앞선 차에 양보)
  casual:
    - "블루 플래그. 직선에서 보내줘."
    - "블루 떴어. 라인 유지."
    - "블루. 페이스 지키면서 보내."
    - "블루. 코너 말고 직선에서."
    - "블루 플래그. 배틀 아니야, 편하게."
    - "블루. 타임 로스 최소로."
  urgent:
    - "블루 블루! 보내줘."
    - "블루! 라인 유지, 직선 양보."
    - "블루! 깔끔하게 보내자."

fuel_warning:                # 연료 경고 (HIGH)
  casual:
    - "연료 {fuel_laps}랩."
    - "연료 체크. {fuel_laps}랩."
    - "연료 {fuel_laps}랩. 피트 계획 잡자."
    - "탱크에 {fuel_laps}랩."
    - "퓨얼 {fuel_laps}랩. 윈도우 오픈."
    - "연료 {fuel_laps}랩. 준비하고 있어."
    - "{fuel_laps}랩 치 남았어. 세이브 고려."
    - "연료 {fuel_laps}랩. 리프트 앤 코스트."
    - "{fuel_laps}랩 뒤 급유. 염두에 둬."
    - "연료 {fuel_laps}랩. 타이어랑 같이 판단."
  urgent:
    - "연료 {fuel_laps}랩! 세이브."
    - "퓨얼 타이트. {fuel_laps}랩."
    - "연료 {fuel_laps}랩. 배틀 자제."

fuel_critical:               # 연료 긴급 (CRITICAL)
  urgent:
    - "연료 크리티컬. {fuel_laps}랩."
    - "퓨얼 크리티컬. {fuel_laps}랩 안에 박스."
    - "연료 {fuel_laps}랩. 풀 세이브."
    - "탱크 바닥. {fuel_laps}랩 리밋."
    - "연료 한계. {fuel_laps}랩 안에 박스."
    - "크리티컬. 연료 {fuel_laps}랩."
    - "{fuel_laps}랩 마지노선. 세이브."
    - "연료 {fuel_laps}랩. 세이브 필수."

pit_call:                    # 박스 콜 (CRITICAL)
  casual:
    - "박스 박스, 박스 박스."
    - "박스 박스. 이번 랩."
    - "박스 콜. 이번 랩 피트인."
    - "이번 랩 박스."
    - "피트인, 이번 랩. 박스 박스."
    - "박스 박스. 크루 대기 중."
  urgent:
    - "박스 박스! 이번 랩!"
    - "들어와, 박스 박스!"
    - "윈도우 마감. 이번 랩 박스."
    - "박스 박스. 리미터 잊지 마."

# 충격 직후 첫 콜 — 몇 초 뒤 자동 점검 리포트가 따라오므로, 드라이버에게
# 확인을 시키지 않고 "우리가 보고 있다"는 안심 + 예고 톤으로 통일한다.
damage:                      # 데미지 체크 (CRITICAL)
  urgent:
    - "접촉 확인. 데이터 체크 중."
    - "임팩트. 휠, 공기압 확인 중."
    - "데미지 가능성. 보고 있어."
    - "충격 컸어. 결과 곧 불러줄게."
    - "접촉. 프레셔 확인 중."
    - "임팩트. 페이스 유지, 체크 중."
    - "충격 감지. 몇 초만."
    - "데미지 체크 중. 페이스 유지."
    - "접촉 감지. 에어로 확인 중."
    - "임팩트 로그. 문제면 바로 콜."

penalty:                     # 페널티 (CRITICAL)
  casual:
    - "페널티 떴어. 내용 확인 중."
    - "페널티. 처리 타이밍 잡아줄게."
    - "스튜어드 콜. 페널티 하나."
    - "페널티. 침착하게."
    - "페널티. 다음 피트에 처리하자."
    - "페널티 하나. 만회 가능."
    - "페널티 확인. 페이스 유지."
    - "페널티 하나. 전략 다시 계산 중."

race_start:                  # 그린 플래그 (레이스 스타트)
  urgent:
    - "그린 그린 그린!"
    - "그린 플래그!"
    - "스타트! 첫 코너 조심."
    - "그린! 클린 스타트."
    - "레이스 온. 침착하게."
    - "그린. 생존 먼저."

fcy_start:                   # 풀코스옐로/세이프티카 발동
  urgent:
    - "풀코스옐로! 감속."
    - "FCY. 추월 금지, 델타 유지."
    - "세이프티카. 감속."
    - "풀코스옐로. 전략 타임."
    - "FCY! 델타 맞춰."
    - "옐로 전 구간. 추월 금지."

fcy_pit_open:                # FCY 중 피트 오픈 (전략 기회)
  urgent:
    - "피트 오픈! 공짜 피트야."
    - "FCY 피트 오픈. 박스 박스."
    - "피트 열렸어. 박스."
    - "지금 들어와! 손해 없어."
    - "오픈. 박스 박스."

green_flag:                  # 리스타트
  urgent:
    - "그린 그린! 리스타트."
    - "리스타트! 집중."
    - "그린. 다시 레이스."
    - "리스타트 그린. 타이어 온도 체크."
    - "그린! 리스타트에 기회 있어."

race_end:                    # 체커
  casual:
    - "체커! 클래스 {place}등. 수고했어."
    - "체커드 플래그. P{place}."
    - "끝났어. 클래스 P{place}. 좋은 레이스."
    - "체커. P{place}. 디브리핑 정리할게."
    - "피니시. P{place}. 고생했어."

position_up:                 # 클래스 순위 상승
  casual:
    - "클래스 P{place}. 업."
    - "P{place}. 좋아."
    - "P{place}. 흐름 유지."
    - "포지션 업. 클래스 P{place}."

position_down:               # 클래스 순위 하락
  casual:
    - "클래스 P{place}. 침착하게 되찾자."
    - "P{place}. 한 랩씩."
    - "P{place}. 페이스 있으니까 기회 온다."
    - "한 자리 내줬어. P{place}."

pit_limiter:                 # 피트레인 리미터 미작동
  urgent:
    - "리미터! 리미터!"
    - "피트 스피드! 리미터!"
    - "속도 초과. 리미터!"
    - "리미터 안 켜졌어!"
    - "피트레인 속도! 리미터!"
