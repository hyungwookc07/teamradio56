# 긴급 콜 사전 생성 변형 풀 (한국어) — 이벤트 타입 × 톤 태그 구조.
#
# 구조: <풀 이름>: { casual: [...], urgent: [...] }
#   - casual: 평상시 톤. urgent: 배틀 중(±2초 경쟁)/나란히 상황의 긴박 톤.
#   - 톤이 하나뿐인 풀은 그 톤이 폴백으로 쓰인다.
# 재생 시 랜덤 선택 + 최근 사용 이력 제외로 반복감을 줄인다.
# scripts/generate_variants.py로 LLM 일괄 재생성 가능, tools/pregen_audio.py로
# 전체 오디오 사전 캐시 → 지연 0.
#
# 슬롯은 이산값만: {cls}=클래스명(하이퍼카/엘엠피 투/GT3/상위 클래스),
# {gap}=초(정수 1~6), {fuel_laps}=랩(정수 1~4). 연속값 금지(캐시 불가).

traffic_approach:            # 접근 예고 (도달 3~10초 전)
  casual:
    - "{cls}, {gap}초 뒤."
    - "{cls} 접근 중, {gap}초 뒤에 온다."
    - "뒤에 {cls}, {gap}초. 라인 유지해."
    - "{cls}가 {gap}초 뒤야. 미리 준비해."
    - "{gap}초 뒤 {cls}. 니 레이스에 집중해."
    - "{cls} 오고 있어, {gap}초. 라인 일정하게 가자."
    - "뒤쪽 {cls}, {gap}초 안에 붙는다."
    - "{gap}초 후 {cls} 지나간다. 라인 그대로."
    - "체크. {cls}가 {gap}초 뒤에 있어."
    - "{cls} 트래픽 {gap}초. 코너에서 양보하지 말고 직선에서 보내."
    - "뒤에서 {cls} 온다. {gap}초."
    - "{cls} 하나, {gap}초 뒤. 흐름 깨지 말자."
    - "{gap}초 뒤에 {cls} 붙는다. 침착하게."
    - "곧 {cls} 온다. {gap}초 남았어."
    - "{cls}한테 {gap}초. 니 페이스 유지해."
  urgent:
    - "트래픽! {cls} {gap}초 뒤."
    - "{cls} 클로징, {gap}초. 당황하지 마."
    - "{cls} 접근, {gap}초. 미러 봐."
    - "랩 트래픽이야. {cls} {gap}초 뒤."
    - "{cls} {gap}초. 놀라지 말고 하던 대로."
    - "{cls} 빠르게 온다, {gap}초!"
    - "미러 체크, {cls} {gap}초."
    - "{gap}초 뒤 {cls}, 배틀 중이니까 더 조심."

