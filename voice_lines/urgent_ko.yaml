# 긴급 콜 사전 생성 변형 풀 (한국어).
#
# - 재생 시 랜덤 선택 + 최근 사용 이력 제외로 반복감을 줄인다.
# - tools/pregen_audio.py가 모든 변형 × 슬롯 값 조합을 TTS로 사전 합성해
#   audio_cache에 저장하므로, 실전에서는 지연 0으로 재생된다.
# - 슬롯은 이산값만 쓴다: {cls}=클래스명, {gap}=초(정수 1~6), {fuel_laps}=랩(정수 1~4)
#   연속값을 넣으면 사전 캐시가 불가능해지니 새 슬롯 추가 시 주의.

traffic_approach:            # 상위 클래스 접근 예고: "하이퍼카 뒤로 4초"
  - "{cls} 뒤로 {gap}초."
  - "{cls} 접근 중, {gap}초 뒤에 온다."
  - "뒤에 {cls}, {gap}초. 라인 유지해."
  - "{cls}가 {gap}초 뒤야. 미리 준비해."
  - "트래픽. {cls} {gap}초 뒤."
  - "{gap}초 뒤 {cls}. 니 레이스에 집중해."
  - "{cls} 오고 있어, {gap}초. 예측 가능하게 가자."
  - "뒤쪽 {cls}, {gap}초 안에 붙는다."
  - "{cls} 클로징, {gap}초. 당황하지 마."
  - "{gap}초 후 {cls} 지나간다. 라인 그대로."
  - "체크. {cls}가 {gap}초 뒤에 있다."
  - "{cls} 트래픽 {gap}초. 코너에서 양보하지 말고 직선에서 보내."
  - "뒤에서 {cls} 온다. {gap}초."
  - "{cls}야, {gap}초 뒤. 흐름 깨지 말자."
  - "{gap}초 뒤에 {cls} 도착. 침착하게."
  - "{cls} 어프로치, {gap}초. 미러 봐."
  - "곧 {cls} 온다. {gap}초 남았어."
  - "{cls}한테 {gap}초. 니 페이스 유지해."
  - "블루 상황이야. {cls} {gap}초 뒤."
  - "{cls} {gap}초. 놀라지 말고 하던 대로."

traffic_close_ahead:         # 근접 경고: 앞 50m 이내
  - "바로 앞에 차 있어. 조심해."
  - "앞차 근접. 간격 봐."
  - "코앞에 차야. 무리한 다이브 금지."
  - "앞에 붙었어. 더티 에어 조심."
  - "앞차랑 가까워. 브레이킹 여유 둬."
  - "바로 앞 트래픽. 침착하게."
  - "앞차 슬로우. 거리 유지해."
  - "앞에 차 있다. 타이밍 보고 들어가."
  - "앞차 근접 중. 서두르지 마."
  - "앞에 하나 있어. 깨끗하게 처리하자."
  - "앞차와 간격 좁다. 조심."
  - "클로즈 어헤드. 시야 확보해."
  - "앞차 바로 앞이야. 접촉만 피하자."
  - "앞에 붙었다. 기회는 온다, 기다려."
  - "앞차 근접. 라인 하나 남겨둬."

traffic_close_behind:        # 근접 경고: 뒤 50m 이내
  - "바로 뒤에 차 있어."
  - "뒤차 근접. 라인 유지해."
  - "뒤에 붙었어. 방어는 한 번만."
  - "뒤차 코앞이야. 예측 가능하게 움직여."
  - "뒤에 하나 붙었다. 침착하게."
  - "클로즈 비하인드. 미러 체크."
  - "뒤차 바로 뒤. 니 라인 지켜."
  - "뒤에 있어. 이상한 움직임만 하지 마."
  - "뒤차 근접 중. 브레이킹 포인트 일정하게."
  - "뒤에 붙었어. 실수 유도하려는 거야, 말리지 마."
  - "뒤차와 간격 좁다. 깔끔하게 가자."
  - "바로 뒤야. 하던 대로 해."
  - "뒤에 차 있다. 수비적으로 갈 필요 없어."
  - "뒤차 붙었다. 트랙 포지션 우선."
  - "뒤쪽 근접. 페이스로 떨쳐내자."

fuel_warning:                # 연료 경고 (HIGH)
  - "연료 앞으로 {fuel_laps}랩 분량이야."
  - "연료 체크. {fuel_laps}랩 남았어."
  - "연료 {fuel_laps}랩. 피트 계획 잡자."
  - "탱크에 {fuel_laps}랩 남았다."
  - "연료 상황, {fuel_laps}랩 분량. 곧 불러줄게."
  - "퓨얼 {fuel_laps}랩. 윈도우 열렸어."
  - "연료로는 {fuel_laps}랩이야. 준비하고 있어."
  - "{fuel_laps}랩 치 연료 남았어. 세이브 모드 고려해."
  - "연료 잔량 {fuel_laps}랩. 리프트 앤 코스트 섞어줘."
  - "퓨얼 윈도우 근접. {fuel_laps}랩 남았다."
  - "연료 {fuel_laps}랩 분량. 계획대로 가고 있어."
  - "탱크 기준 {fuel_laps}랩. 무리하지 말자."
  - "연료 보고. {fuel_laps}랩 커버 가능."
  - "{fuel_laps}랩 뒤엔 넣어야 해. 염두에 둬."
  - "연료는 {fuel_laps}랩이야. 타이어랑 같이 판단하자."

fuel_critical:               # 연료 긴급 (CRITICAL)
  - "연료 심각해. {fuel_laps}랩이면 바닥이야."
  - "퓨얼 크리티컬. {fuel_laps}랩 안에 들어와야 해."
  - "연료 {fuel_laps}랩. 지금부터 풀 세이브."
  - "탱크 거의 비었어. {fuel_laps}랩 리밋."
  - "연료 한계야. {fuel_laps}랩 안에 박스."
  - "크리티컬. 연료 {fuel_laps}랩 남았다."
  - "연료 바닥 보인다. {fuel_laps}랩이 마지노선."
  - "퓨얼 이머전시. {fuel_laps}랩, 그 이상은 없어."
  - "연료 {fuel_laps}랩. 세이브 안 하면 못 들어와."
  - "마지막 경고야. 연료 {fuel_laps}랩."
  - "연료 위험 수준. {fuel_laps}랩 안에 결정해."
  - "{fuel_laps}랩 치밖에 없어. 박스 준비."

pit_call:                    # 박스 콜 (CRITICAL)
  - "박스 박스, 박스 박스."
  - "박스 박스. 이번 랩에 들어와."
  - "박스 콜이야. 이번 랩 피트인."
  - "이번 랩 박스. 컨펌해줘."
  - "피트인, 이번 랩이야. 박스 박스."
  - "들어와. 박스 박스."
  - "박스 박스. 피트 리밋 잊지 마."
  - "이번 랩에 박스. 마커 놓치지 마."
  - "박스 박스. 크루 준비됐어."
  - "피트 윈도우 마감이야. 이번 랩 박스."
  - "박스 콜. 진입 라인 조심하고."
  - "오케이, 박스 박스. 이번 랩."

damage:                      # 데미지 체크 (CRITICAL)
  - "접촉 확인. 차 상태 어때?"
  - "임팩트 감지됐어. 핸들링 체크해봐."
  - "데미지 있을 수 있어. 데이터 보고 있다."
  - "방금 충격 컸어. 차 괜찮아?"
  - "접촉이야. 타이어 프레셔 확인 중."
  - "임팩트. 스티어링 센터 맞는지 봐줘."
  - "차에 충격 들어왔어. 이상하면 바로 말해."
  - "데미지 체크 중. 일단 페이스 유지해."
  - "접촉 감지. 에어로 손상 가능성 있어."
  - "충격 확인했어. 다음 스트레이트에서 감각 체크해봐."
  - "방금 그거 컸다. 차 반응 어때?"
  - "임팩트 로그 떴어. 문제 있으면 박스 검토하자."

penalty:                     # 페널티 (CRITICAL)
  - "페널티 떴어. 확인해."
  - "페널티야. 처리 타이밍 잡아줄게."
  - "스튜어드 콜, 페널티 하나."
  - "페널티 부여됐어. 침착하게."
  - "페널티 떴다. 다음 피트 때 같이 처리하자."
  - "페널티 하나 쌓였어. 드라이브 스루 각오해."
  - "페널티 확인. 억울해도 지금은 페이스 유지."
  - "페널티야. 만회 가능한 수준이야."
  - "페널티 하나. 처리 전략 다시 계산 중."
  - "스튜어드가 봤나 봐. 페널티 하나 떴어."
