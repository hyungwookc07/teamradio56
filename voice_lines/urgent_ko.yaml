    - "클리어. 다시 니 라인으로."
    - "보냈어. 페이스 다시 올리자."
    - "지나갔다. 리듬 되찾아."
    - "클리어야, 정상 라인으로."
    - "갔어. 이제 니 레이스 하자."
    - "통과했어. 손해 최소화 잘했어."
    - "보냈고, 앞은 클리어."

dropped:                     # 배틀하던 차가 떨어짐
  casual:
