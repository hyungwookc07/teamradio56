    - "왼쪽에 있어!"
    - "왼쪽 나란히!"
    - "카 레프트, 조심!"
    - "왼쪽에 붙었어, 라인 지켜."
    - "왼쪽이야, 조이지 마!"
    - "왼쪽 옆이야. 공간 남겨."
    - "레프트 사이드! 접촉 조심."

alongside_right:             # 오른쪽에 나란히
