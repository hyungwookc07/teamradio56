    - "뒤차 근접. 라인 유지해."
    - "뒤에 있어. 움직임 일정하게 가져가."
    - "뒤차 붙었다. 하던 대로 해."
    - "{cls} 뒤에 붙었어."
    - "뒤에 차 있어. 갑자기 라인 바꾸지만 마."
    - "뒤차 근접 중. 브레이킹 포인트 일정하게."
  urgent:
    - "뒤 붙었어!"
    - "뒤차 코앞이야. 방어는 한 번만."
    - "뒤에 붙었다, 실수 유도하려는 거야. 말리지 마."
    - "바로 뒤야! 니 라인 지켜."
    - "붙었어 뒤에. 깔끔하게 가자."
    - "{cls} 바로 뒤야!"
    - "뒤차 근접, 트랙 포지션 우선."

pass_complete:               # 추월당함 완료 → 서사 마무리
