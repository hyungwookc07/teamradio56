# Pre-generated urgent call pools (English) — event type × tone.
#
# Structure: <pool>: { casual: [...], urgent: [...] }
# Style: real team radio — short, word-first, minimal grammar.
# Slots (discrete only, for audio caching): {cls}=class name, {gap}=1-6 sec,
# {fuel_laps}=1-4 laps, {side}=left/right, {place}=real class place (1-60),
# {gained}=places gained since the start (2-56), {nth}=second/third.
#
# Whole-clip pools are rendered line by line (voice.iter_pregen_texts). Pools whose
# numbers would explode the clip count (race_end_gained/held/lost/result,
# position_up/down) are spoken from sentence segments instead — every line is split
# on sentence ends and "P{place}." is its own sentence, shared with the HUD reports
# (voice.SEGMENT_POOL_SLOTS). Keep those numbers in their own sentence.

traffic_approach:
  casual:
    - "{cls} behind, {gap}."
    - "{cls} closing, {gap}."
    - "{cls} in {gap}. Hold your line."
    - "{cls}, {gap} back. Stay on it."
    - "Traffic. {cls}, {gap}."
    - "{cls} coming, {gap} out. Let him by on the straight."
    - "Heads up, {cls} in {gap}."
    - "{cls} through in {gap}. Line as normal."
    - "{cls} traffic behind, {gap}."
    - "One {cls}, {gap} back."
  urgent:
    - "Traffic! {cls}, {gap}."
    - "{cls} closing fast, {gap}."
    - "{cls}, {gap} out. Mirrors."
    - "Faster traffic, {cls} in {gap}."
    - "{cls} {gap} back. Stay on line."
    - "{cls} coming, {gap}!"
    - "Mirror check. {cls}, {gap}."

