name: audio-pack
# 코코로 음성 팩 — CI에서 샤드 병렬 렌더 → 합치기 → zip 분할 → audio-<pack> 릴리스(프리릴리스, latest 아님)
# → voice_lines/audio_pack.txt를 실행한 브랜치에 커밋. 팩 릴리스는 한 번 게시하면 바꾸지 않는다.
on:
  workflow_dispatch:
    inputs:
      pack:
        description: 팩 ID (zip 이름·태그 audio-<pack>). 멘트 집합이 바뀌면 새 ID — kokoro-v016은 HUD 리포트 3단계·도메인 확장 문장 포함
        type: string
        default: kokoro-v016
      dry_run:
        description: 렌더·zip·아티팩트만 (게시·커밋 안 함)
        type: boolean
        default: false
permissions: {}
# 직렬화는 게시 잡에만 — 워크플로 전체에 걸면 대기 중인 실행이 뒤에 들어온 실행에 밀려 취소된다
env:
  REPO: hyungwookc07/teamradio56
  PACK: ${{ inputs.pack }}
  KOKORO_MODEL_SHA256: 7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5
  KOKORO_VOICES_SHA256: bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d
# 명시한 bash는 -eo pipefail로 돈다 (기본 bash -e는 '| tee' 실패를 삼킨다)
defaults:
  run:
    shell: bash
jobs:
  # 입력·트리 검사와 모델 캐시는 한 번만 — 렌더 샤드는 캐시를 먼저 쓰고, 없으면 받아서 sha256 확인
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: 입력 확인 (브랜치에서만, 팩 ID 규칙, 기존 팩 릴리스 없음)
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          [ "$REF_TYPE" = branch ] || { echo "::error::브랜치에서 실행하세요 (기술자를 그 브랜치에 커밋합니다)"; exit 1; }
          [[ "$PACK" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,121}$ && "$PACK" != *..* ]] || { echo "::error::팩 ID 형식: $PACK"; exit 1; }
          if gh release view "audio-$PACK" --repo "$REPO" > /dev/null 2>&1; then
            echo "::error::audio-$PACK 릴리스가 이미 있습니다 — 팩은 바꾸지 않습니다. 새 팩 ID를 쓰세요"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-gates
        with:
          requirements: tools/requirements-pack.txt
      - name: 렌더 전 게이트 (긴 렌더 전에 트리가 멀쩡한지 — 샤드 분할 검사 포함)
        run: bash simhub/verify/build-check.sh && bash simhub/verify/replay-check.sh
        env:
          TEAMRADIO56_STRICT: '1'
      - id: models
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: kokoro-model-files-v1.0-7d5df8ec-bca610b8
      - name: 코코로 모델 (없으면 받기) + sha256 확인
        run: bash .github/scripts/kokoro-models.sh models
      - if: steps.models.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: ${{ steps.models.outputs.cache-primary-key }}

  # 통문장·세그먼트 목록을 샤드 수로 나눠 병렬 렌더 (pregen_audio.py --shard K/N).
  # 한 샤드가 실패해도 나머지는 끝까지 — 'Re-run failed jobs'로 실패한 샤드만 다시 돌린다
  # (샤드 아티팩트 보존 30일 = GitHub 재실행 기한. 그 뒤엔 전체 재실행)
  render:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-gates
        with:
          requirements: tools/requirements-pack.txt
      # 캐시 저장은 실패해도 prepare가 초록이고, 'Re-run failed jobs'는 prepare를 다시 돌리지
      # 않는다 — 캐시가 없으면 여기서 받는다 (kokoro-models.sh가 sha256 고정)
      - id: models
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: kokoro-model-files-v1.0-7d5df8ec-bca610b8
      - if: steps.models.outputs.cache-hit != 'true'
        run: echo "::warning::코코로 모델 캐시 없음 — 이 샤드에서 내려받는다"
      - name: 코코로 모델 (캐시 없으면 받기) + sha256 확인
        run: bash .github/scripts/kokoro-models.sh models
      - name: 렌더 (샤드 ${{ matrix.shard }}/${{ strategy.job-total }} — 통문장 → 문장 세그먼트)
        timeout-minutes: 220
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          [ ! -e config.yaml ] || { echo "::error::config.yaml이 있으면 렌더 설정이 바뀝니다"; exit 1; }
          mkdir -p "$RUNNER_TEMP/logs"
          python tools/pregen_audio.py --engine kokoro --shard "$SHARD" 2>&1 \
            | tee "$RUNNER_TEMP/logs/whole.log"
          python tools/pregen_audio.py --engine kokoro --segments --tiers 1,2,3 \
            --tracks voice_lines/track_names_en.txt --shard "$SHARD" 2>&1 \
            | tee "$RUNNER_TEMP/logs/segments.log"
          # pack이 샤드가 다 모였는지 확인하는 표식 (팩 zip에는 안 들어간다)
          touch "audio_cache/shard-${SHARD/\//-of-}.done"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-shard-${{ matrix.shard }}
          path: audio_cache/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-logs-${{ matrix.shard }}
          path: ${{ runner.temp }}/logs/
          if-no-files-found: ignore
          retention-days: 14

  # 샤드 캐시 합치기 → zip 분할 + 기술자 → 실캐시 게이트 (빠진 클립이 하나라도 있으면 실패)
  pack:
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-gates
        with:
          requirements: tools/requirements-pack.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: render-shard-*
          path: audio_cache
          merge-multiple: true
      - name: 샤드가 다 모였는지 (표식 shard-K-of-N.done)
        run: |
          shopt -s nullglob
          marks=(audio_cache/shard-*-of-*.done)
          [ ${#marks[@]} -gt 0 ] || { echo "::error::렌더 샤드 아티팩트가 없습니다 (만료됐으면 Re-run all jobs)"; exit 1; }
          n=${marks[0]##*-of-}; n=${n%.done}
          missing=()
          for k in $(seq 1 "$n"); do
            [ -e "audio_cache/shard-$k-of-$n.done" ] || missing+=("$k")
          done
          if [ ${#missing[@]} -gt 0 ] || [ ${#marks[@]} -ne "$n" ]; then
            echo "::error::샤드 ${missing[*]:-?} / $n 이 없거나 섞였습니다 (${#marks[@]}개 표식) — 아티팩트가 만료됐으면 Re-run all jobs"
            exit 1
          fi
          rm -f "${marks[@]}"
          echo "✅ 샤드 $n개, 합친 캐시: $(find audio_cache -maxdepth 1 -type f | wc -l)개 파일"
      - name: zip 분할 + 기술자 갱신
        run: |
          python tools/pack_audio.py build --cache audio_cache --pack "$PACK" \
            --out "dist/audio/$PACK" --descriptor voice_lines/audio_pack.txt --tag "audio-$PACK"
          cp voice_lines/audio_pack.txt "dist/audio/audio_pack.txt"
          git diff -- voice_lines/audio_pack.txt
      - name: 렌더 후 게이트 (실캐시 100% Resolve + 새 zip 기술자 대조 + 음성 팩 설치 흐름)
        run: bash simhub/verify/replay-check.sh
        env:
          TEAMRADIO56_STRICT: '1'
          TEAMRADIO56_REQUIRE_CACHE: '1'
          TEAMRADIO56_AUDIO_DIR: dist/audio/${{ inputs.pack }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: teamradio56-audio-${{ inputs.pack }}
          path: dist/audio/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    needs: pack
    if: ${{ !inputs.dry_run && github.repository == 'hyungwookc07/teamradio56' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    concurrency:
      group: audio-pack-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: teamradio56-audio-${{ inputs.pack }}
          path: dist/audio
      - name: 초안 릴리스 → 기술자 커밋·push → 게시 (prerelease, latest 아님)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/publish-audio.sh
