name: release
# 플러그인 릴리스 — v* 태그 push(게시: git push로 태그를 올리거나 GitHub 화면에서 릴리스를 만들면
# 태그가 생기며 시작), release/v<버전> 브랜치 push(게시 — 태그를 push할 수 없을 때, 태그는 게시하며
# 생긴다), release-dry/** 브랜치 push(dry run), 수동 실행(기본 dry_run).
# 게시물은 이 워크플로가 Windows에서 실제 SimHub으로 만든 아티팩트 그대로다 (스텁 빌드 금지).
# 멘트 집합이 바뀐 게시 실행은 음성 팩을 먼저 렌더·게시하고(audio 잡 → audio-pack.yml, 약 2시간)
# 그 기술자로 빌드한다.
on:
  push:
    tags: ['v*']
    # workflow_dispatch 권한 없이 push만으로 Windows 설치·빌드·검증 경로를 시험한다 (게시·렌더 없음)
    # release/v*: 브랜치 push만 되는 곳에서 게시 (preflight가 이름 = release/v<버전>, 커밋이 main에 있음,
    # 태그 없음을 확인하고 수동 게시처럼 --target으로 태그를 만든다)
    branches: ['release-dry/**', 'release/v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 빌드·패키징·아티팩트만 (게시 안 함)
        type: boolean
        default: true
      simhub_version:
        description: 빌드에 쓸 SimHub 버전 (SHWotever/SimHub 릴리스 태그)
        type: string
        default: '9.13.3'
      notes:
        description: 설정 화면 '변경 사항' 한 줄 (태그 push는 주석 태그 제목)
        type: string
        default: ''
permissions: {}
# 직렬화는 게시 잡에만 건다 — 워크플로 전체에 걸면 대기 중인 태그 게시 실행이 뒤에 들어온
# dry run에 밀려 취소된다 (그룹마다 대기 실행은 하나만 남는다)
env:
  REPO: hyungwookc07/teamradio56
# 명시한 bash는 -eo pipefail로 돈다 (기본 bash -e는 '| tee' 실패를 삼킨다)
defaults:
  run:
    shell: bash
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      publish: ${{ steps.ver.outputs.publish }}
      adopt: ${{ steps.ver.outputs.adopt }}
      simhub_version: ${{ steps.ver.outputs.simhub_version }}
      notes: ${{ steps.ver.outputs.notes }}
      need_pack: ${{ steps.audio.outputs.need_pack }}
      pack: ${{ steps.audio.outputs.pack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check -r tools/requirements-ci.txt
      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          SIMHUB_VERSION: ${{ inputs.simhub_version || '9.13.3' }}
          NOTES_INPUT: ${{ inputs.notes }}
        run: bash .github/scripts/release-preflight.sh
      - name: 음성 팩 릴리스 확인 (존재·크기·sha256·멘트 집합) → 새 팩이 필요한지
        id: audio
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ steps.ver.outputs.publish }}
          BRANCH: main
        run: bash .github/scripts/check-audio-release.sh "$REPO" voice_lines/audio_pack.txt "$RUNNER_TEMP/audio"

  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-gates
      - run: bash simhub/verify/build-check.sh
      - run: bash simhub/verify/replay-check.sh
        env:
          TEAMRADIO56_STRICT: '1'

  # 멘트 집합이 바뀐 게시 실행만 — 새 팩 렌더 → audio-<pack> 게시 → 기술자를 main에 커밋.
  # 렌더 전 게이트는 audio-pack의 prepare가 따로 돈다 (gates를 기다리지 않는다)
  audio:
    needs: preflight
    if: needs.preflight.outputs.publish == 'true' && needs.preflight.outputs.need_pack == 'true'
    # 불린 워크플로의 잡 권한은 여기를 넘지 못한다 (publish 잡이 contents: write)
    permissions:
      contents: write
    uses: ./.github/workflows/audio-pack.yml
    with:
      pack: ${{ needs.preflight.outputs.pack }}
      dry_run: false
      branch: main

  # audio가 돌면 끝날 때까지 기다리고, 건너뛰면(팩이 맞음) 바로 — 실패·취소는 막는다.
  # 상태 함수를 쓰면 암묵적 success()가 빠지므로 결과를 하나씩 본다
  build:
    needs: [preflight, gates, audio]
    if: >-
      ${{ !cancelled()
      && needs.preflight.result == 'success' && needs.gates.result == 'success'
      && (needs.audio.result == 'success'
      || (needs.audio.result == 'skipped' && needs.preflight.outputs.need_pack != 'true')) }}
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SIMHUB_VERSION: ${{ needs.preflight.outputs.simhub_version }}
      SIMHUB_DIR: C:\simhub-ci\${{ needs.preflight.outputs.simhub_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - id: simhub-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SIMHUB_DIR }}
          key: simhub-${{ env.SIMHUB_VERSION }}-${{ runner.os }}-${{ hashFiles('simhub/ci/install-simhub.ps1') }}
      - name: SimHub 무인 설치 (캐시 없을 때)
        if: steps.simhub-cache.outputs.cache-hit != 'true'
        timeout-minutes: 25
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File simhub\ci\install-simhub.ps1 `
            -Version $env:SIMHUB_VERSION -Dir $env:SIMHUB_DIR -LogDir "$env:RUNNER_TEMP\simhub-log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: SimHub 설치 확인 (캐시 적중 포함)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File simhub\ci\install-simhub.ps1 `
            -Version $env:SIMHUB_VERSION -Dir $env:SIMHUB_DIR -VerifyOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: steps.simhub-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SIMHUB_DIR }}
          key: ${{ steps.simhub-cache.outputs.cache-primary-key }}
      # 새 팩을 렌더했으면 그 실행의 기술자로 빌드한다 (태그 커밋의 기술자는 옛 팩)
      - if: needs.preflight.outputs.need_pack == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: teamradio56-audio-${{ needs.preflight.outputs.pack }}
          path: dist/audio
      - name: 변경 사항 한 줄 → UTF-8 파일 (명령줄에 한글을 싣지 않는다)
        shell: powershell
        env:
          TR56_NOTES: ${{ needs.preflight.outputs.notes }}
        run: |
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\notes.txt", "$env:TR56_NOTES", (New-Object Text.UTF8Encoding($false)))
      - name: release.ps1 (CI 모드 — 실제 SimHub 빌드 → zip → 매니페스트)
        shell: cmd
        env:
          EXPECT_TAG: ${{ needs.preflight.outputs.tag }}
          DRY: ${{ needs.preflight.outputs.publish != 'true' && '-DryRun' || '' }}
          # dist\는 .gitignore — 기술자를 voice_lines에 덮어쓰면 '커밋하지 않은 변경'으로 멈춘다
          AUDIO_PACK_FILE: ${{ needs.preflight.outputs.need_pack == 'true' && 'dist\audio\audio_pack.txt' || 'voice_lines\audio_pack.txt' }}
        run: >-
          release.bat -Ci -SimHubPath "%SIMHUB_DIR%" -OutDir dist\ci\assets -MetaDir dist\ci\meta
          -ExpectTag %EXPECT_TAG% -NotesFile "%RUNNER_TEMP%\notes.txt" -AudioPackFile "%AUDIO_PACK_FILE%" %DRY%
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: teamradio56-release-${{ needs.preflight.outputs.version }}
          path: dist/ci/
          if-no-files-found: error
          retention-days: 30
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simhub-install-log
          path: ${{ runner.temp }}/simhub-log/
          if-no-files-found: ignore
          retention-days: 7

  # build가 audio 건너뜀 뒤에 돌면 암묵적 success()가 거짓이 된다 (건너뛴 조상 잡) — 결과로 본다
  verify-artifact:
    needs: [preflight, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-gates
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: teamradio56-release-${{ needs.preflight.outputs.version }}
          path: dist/ci
      - if: needs.preflight.outputs.need_pack == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: teamradio56-audio-${{ needs.preflight.outputs.pack }}
          path: dist/audio
      - name: 게시될 파일로 사용자 업데이트 흐름 재현 (플러그인 교체 + 음성 팩 설치)
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ needs.preflight.outputs.publish }}
          DESC: ${{ needs.preflight.outputs.need_pack == 'true' && 'dist/audio/audio_pack.txt' || 'voice_lines/audio_pack.txt' }}
          EXPECT_PACK: ${{ needs.preflight.outputs.need_pack == 'true' && needs.preflight.outputs.pack || '' }}
        run: bash .github/scripts/verify-release-artifact.sh dist/ci "$RUNNER_TEMP/audio" "$DESC"

  publish:
    needs: [preflight, verify-artifact]
    if: >-
      ${{ !cancelled() && needs.verify-artifact.result == 'success'
      && needs.preflight.outputs.publish == 'true' && github.repository == 'hyungwookc07/teamradio56' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: teamradio56-release-${{ needs.preflight.outputs.version }}
          path: dist/ci
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          SHA: ${{ github.sha }}
          # tag: 이미 있는 태그에 게시(빈 릴리스 이어받기 포함) / dispatch: 수동 게시·release/v* push — 태그를 만든다
          MODE: ${{ github.event_name == 'push' && github.ref_type == 'tag' && 'tag' || 'dispatch' }}
        run: bash .github/scripts/publish-release.sh
