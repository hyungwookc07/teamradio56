name: ci
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# 명시한 bash는 -eo pipefail로 돈다 (기본 bash -e는 '| tee' 실패를 삼킨다)
defaults:
  run:
    shell: bash
jobs:
  gates:
    name: build-check + replay-check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-gates
      - run: bash simhub/verify/build-check.sh
      - run: bash simhub/verify/replay-check.sh
        env:
          TEAMRADIO56_STRICT: '1'
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
