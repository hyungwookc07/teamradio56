name: setup-gates
description: 게이트 도구 — dotnet 8, python 3.11 + 고정 의존성, pwsh 확인
inputs:
  requirements:
    description: pip 요구 파일 (렌더 잡은 tools/requirements-pack.txt)
    required: false
    default: tools/requirements-ci.txt
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '8.0.x'
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: tools/requirements-*.txt
    - shell: bash
      env:
        REQ: ${{ inputs.requirements }}
      run: |
        python -m pip install --disable-pip-version-check -r "$REQ"
        # 게이트가 조용히 건너뛰지 않게 도구가 다 있는지 먼저 본다 (pwsh는 러너 이미지 기본)
        command -v pwsh > /dev/null || { echo "::error::pwsh 없음"; exit 1; }
        python -c "import numpy, soundfile, yaml"
        dotnet --version && python --version && pwsh --version
